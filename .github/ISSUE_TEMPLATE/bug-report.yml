name: Relatar um problema
description: Relate um comportamento incorreto ou inesperado
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo relato. Não inclua credenciais, tokens ou dados de clientes.
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir?
      description: Liste os passos mínimos para reproduzir o problema.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Informe sistema, navegador, commit ou versão relevante.
